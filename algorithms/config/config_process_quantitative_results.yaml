# Quantitative result processing config for algorithms/process_quantitative_results.py.
#
# Run:
#   python algorithms/process_quantitative_results.py --config algorithms/config/config_process_quantitative_results.yaml
#
# The script selects one row from each prompt-level CSV and aggregates metrics
# across prompts for each experiment folder.

# Each item can be an experiment folder containing results_* prompt folders, or a
# parent folder to search recursively for experiment folders.
experiment_folders:
  - results_sdxlturbo/results_adam_sdxlturbo_clip
  - results_sdxlturbo/results_adam_sdxlturbo_hpsv2
  - results_sdxlturbo/results_adam_sdxlturbo_imagereward
  - results_sdxlturbo/results_cosyne_sdxlturbo_clip
  - results_sdxlturbo/results_cosyne_sdxlturbo_hpsv2
  - results_sdxlturbo/results_cosyne_sdxlturbo_imagereward
  - results_sdxlturbo/results_ga_sdxlturbo_clip
  - results_sdxlturbo/results_ga_sdxlturbo_hpsv2
  - results_sdxlturbo/results_ga_sdxlturbo_image_reward
  - results_sdxlturbo/results_sepcmaes_sdxlturbo_clip
  - results_sdxlturbo/results_sepcmaes_sdxlturbo_hpsv2
  - results_sdxlturbo/results_sepcmaes_sdxlturbo_imagereward
  - results_sdxlturbo/results_snes_sdxlturbo_clip
  - results_sdxlturbo/results_snes_sdxlturbo_hpsv2
  - results_sdxlturbo/results_snes_sdxlturbo_imagereward
  - results_sdxlturbo/results_zeroorder_sdxlturbo_clip
  - results_sdxlturbo/results_zeroorder_sdxlturbo_hpsv2
  - results_sdxlturbo/results_zeroorder_sdxlturbo_image_reward

# Output workbook. CSV mirrors are written beside this file.
output_excel: results_quantitative_sdxlturbo/quantitative_results_sdxlturbo.xlsx

# Which row to use from each prompt-level CSV before aggregating across prompts:
#   last: final row in the CSV
#   best: row with best combined_score/max_fitness
#   first: initial row
row_selector: best

# Optional elapsed-time budget in seconds, applied separately to each experiment.
# Read all prompt runs fully, then average elapsed_time across prompts at each
# iteration/generation. Keep steps whose mean elapsed time is <= this limit,
# then apply row_selector to each prompt's remaining rows. Individual prompt
# times may exceed the limit. Means use available finite nonnegative times at
# each step; missing steps are not interpolated. Runs with no eligible steps are
# skipped with a warning; missing elapsed_time or step columns raise an error.
# Summaries and pairwise tests use the selected rows within this budget.
# Example: time_limit: 60. Set null to use the full runs.
time_limit: null

# canonical summarizes objective, aesthetic_score, clip_score, image_reward_score,
# hpsv2_score, pickscore_score, jpeg_size_kb, elapsed_time, and peak_vram_mb when
# those columns exist. Use auto to summarize every numeric CSV column except basic
# metadata/step columns, or provide a list of metric names/columns.
metrics: canonical

# Two-sided paired Wilcoxon tests on shared prompt text, grouped by model,
# backend and optimization objective (target_variable). Requires unique prompts
# per experiment. Missing/nonfinite metric pairs are excluded per comparison.
# Holm correction covers ALL valid tests in the output, across metrics/objectives.
# Differences are A minus B; positive means A is numerically higher, not always better.
# Outputs: pairwise_tests Excel sheet and quantitative_pairwise_tests.csv.
statistics:
  enabled: true
  alpha: 0.05
