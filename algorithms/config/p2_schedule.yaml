# Each item in "runs" is merged onto algorithms/config/config_p2_experiments.yaml
# before launching one run of algorithms/p2_experiments.py.

runs:
  - aesthetic_score_weight: 0.0
    clip_score_weight: 1.0
    results_folder: "results_random_sampler_sdxl_clip"

  - aesthetic_score_weight: 0.5
    clip_score_weight: 0.5
    results_folder: "results_random_sampler_sdxl_balanced"
