# Batch schedule: algorithms/experiments_schedule.py; overrides config_run_experiments.yaml.
# Token-search options; see README.md for the search-space and output conventions.
runs:  # Ordered override mappings, recursively merged with the base config; jobs run sequentially.
- optimization_method: ga  # Options: ga, gomea, random_sampler.
  results_folder: results_ga_tokens  # Root output directory; model/method and prompt run folders are created beneath it.
- optimization_method: gomea  # Options: ga, gomea, random_sampler.
  results_folder: results_gomea_tokens  # Root output directory; model/method and prompt run folders are created beneath it.
- optimization_method: random_sampler  # Options: ga, gomea, random_sampler.
  results_folder: results_random_sampler_tokens  # Root output directory; model/method and prompt run folders are created beneath it.
