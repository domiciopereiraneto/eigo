# Batch-experiment schedule for algorithms/experiments_schedule.py.
#
# Each item in runs is recursively merged onto config_run_experiments.yaml before
# launching run_experiments.py. Put tuned algorithm parameters and objective
# weights here, while keeping shared prompt/model defaults in the base config.

runs:
  - optimization_method: "adam"
    cuda: 1
    aesthetic_score_weight: 0.0
    clip_score_weight: 1.0
    image_reward_score_weight: 0.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    adam_lr: 0.004370393536723549
    adam_weight_decay: 1.0e-06
    adam_beta1: 0.8295092911236287
    adam_beta2: 0.9573436157399957
    adam_eps: 1.1646204201491381e-08
    results_folder: "results_adam_sanasprint_clip"

  - optimization_method: "cmaes"
    cuda: 1
    aesthetic_score_weight: 0.0
    clip_score_weight: 0.0
    image_reward_score_weight: 1.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_sepcmaes_sanasprint_imagereward"
