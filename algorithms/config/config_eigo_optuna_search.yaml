# Prompts evaluated by each Optuna trial are sampled from optuna.prompt_source.
# To use explicit prompts instead, set optuna.prompt_source.type: "config" and
# add selected_prompts here.

# Select which optimizers Optuna can sample.
# If more than one is enabled, Optuna samples the optimizer as a categorical parameter.
test_adam: false
test_ga: false
test_cmaes: false
test_random_sampler: false
test_zero_order: false
test_snes: true
test_cosyne: false

# General parameters (copied from config_eigo.yaml)
seed: 42
cuda: 1
predictor: 2
num_inference_steps: 50
batch_size: 8
guidance_scale: 7.5
lcm_origin_steps: 50
height: 512
width: 512
aesthetic_score_weight: 0.0
clip_score_weight: 0.0
image_reward_score_weight: 1.0
hpsv2_score_weight: 0.0
pickscore_score_weight: 0.0
jpeg_size_weight: 0.0
max_aesthetic_score: 10
max_clip_score: 0.5
max_image_reward_score: 1.0
max_hpsv2_score: 1.0
max_pickscore_score: 1.0
max_jpeg_size_kb: 1024.0
jpeg_quality: 95
image_reward_model: "ImageReward-v1.0" # Set to null to disable ImageReward calculation
clip_model_name: "ViT-B/32"  # OpenAI CLIP model used for CLIP score and LAION aesthetic predictors
hpsv2_version: "v2.1"  # Set to null to disable HPSv2 calculation
pickscore_model: "yuvalkirstain/PickScore_v1"  # Set to null to disable PickScore calculation
pickscore_processor: "laion/CLIP-ViT-H-14-laion2B-s32B-b79K"  # Set to null to disable PickScore calculation
evaluate_zero_weight_metrics: false  # Keep zero-weight scorer models/graphs out of Adam VRAM
optimization_target: "prompt_embeddings"  # "prompt_embeddings" or "latent_noise" for all optimizers
model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5" # Model ID (e.g., "black-forest-labs/FLUX.1-schnell", "PixArt-alpha/PixArt-XL-2-1024-MS", "Efficient-Large-Model/Sana_Sprint_1.6B_1024px_diffusers", "Efficient-Large-Model/Sana_1600M_1024px_diffusers", "stabilityai/sdxl-turbo", "SimianLuo/LCM_Dreamshaper_v7")
model_backend: "auto" # "auto", "sdxl", "flux", "pixart", "lcm", "sana", or "sana_sprint"
torch_dtype: "float16"
max_sequence_length: 256  # FLUX/Sana text encoder token limit
use_safetensors: true
use_multi_gpu: false
pipeline_device_map: "balanced"
max_memory: null
enable_gradient_checkpointing: false
enable_attention_slicing: false
enable_vae_slicing: false
enable_vae_tiling: false
results_folder: "results_optuna_sd15_snes_imagereward"

# CMA-ES defaults (used if not overridden by optuna.search_space.cmaes)
num_generations: 15
pop_size: 16
cmaes_variant: "sep"
sigma: 0.5
save_gens: false

# SNES defaults (used if not overridden by optuna.search_space.snes)
snes_num_generations: 15
snes_pop_size: 16
snes_sigma: 0.5
snes_eta_mu: 1.0
snes_eta_sigma: null  # null uses the dimension-dependent SNES default

# CoSyNE defaults (used if not overridden by optuna.search_space.cosyne)
cosyne_num_generations: 15
cosyne_pop_size: 16
cosyne_init_range: 0.1
cosyne_mutation_probability: 0.3
cosyne_mutation_scale: 0.3
cosyne_parent_count: 4
cosyne_offspring_count: 4

# Zero-order defaults (used if not overridden by optuna.search_space.zero_order)
zero_order_num_generations: 15
zero_order_pop_size: 16
zero_order_sigma: 0.5

# Adam defaults (used if not overridden by optuna.search_space.adam)
num_iterations: 50
adam_lr: 5e-3
adam_weight_decay: 0
adam_eps: 1e-8
adam_beta1: 0.9
adam_beta2: 0.999
adam_max_grad_norm: null

# GA defaults (used if not overridden by optuna.search_space.ga)
ga_mutation_std: 0.05
ga_elite_count: 1
ga_crossover_rate: 0.8
ga_mutation_rate: 0.1

# Time limit in seconds (null -> use num_generations/num_iterations)
time_limit_seconds: null

optuna:
  n_trials: 30
  direction: "maximize"
  metric: "auto"  # auto -> combined_score for Adam, max_fitness for population methods
  study_name: "eigo_optuna_search_sd15_snes_imagereward"
  storage: "sqlite:///results_optuna_sd15_snes_imagereward/optuna.db"
  load_if_exists: true
  catch_trial_errors: true
  sampler:
    name: "tpe"  # tpe or random
    seed: 42

  prompt_source:
    type: "diffusiondb"  # "diffusiondb" or "config"
    dataset: "poloclub/diffusiondb"
    subset: "2m_random_1k"
    split: "train"
    prompt_column: "prompt"
    count: 10
    seed: 42
    streaming: false
    require_clip_tokenizable: true
    clip_context_length: 77

  plots:
    enabled: true  # true, false, or a list such as ["optimization_history", "slice"]
    output_dir: "optuna_plots"
    include_plotlyjs: "cdn"

  # Supported parameter specs:
  # - list -> categorical choices
  # - {type: categorical, choices: [...]}
  # - {type: float, low: ..., high: ..., log: true|false, step: null}
  # - {type: int, low: ..., high: ..., log: true|false, step: 1}
  search_space:
    adam:
      adam_lr:
        type: "float"
        low: 3e-4
        high: 5e-3
        log: true
      adam_weight_decay:
        type: "categorical"
        choices: [0.0, 1e-6, 1e-4, 1e-3, 1e-2]
      adam_beta1:
        type: "float"
        low: 0.7
        high: 0.95
      adam_beta2:
        type: "float"
        low: 0.9
        high: 0.999
      adam_eps:
        type: "float"
        low: 1e-8
        high: 1e-5
        log: true

    ga:
      # pop_size:
      #   type: "int"
      #   low: 10
      #   high: 50
      #   step: 10
      ga_mutation_std:
        type: "float"
        low: 0.05
        high: 1.0
        log: true
      ga_mutation_rate:
        type: "float"
        low: 0.05
        high: 0.6
      ga_crossover_rate:
        type: "float"
        low: 0.5
        high: 0.95
      ga_elite_count:
        type: "int"
        low: 1
        high: 3

    cmaes:
      # pop_size:
      #   type: "int"
      #   low: 10
      #   high: 60
      #   step: 10
      sigma:
        type: "float"
        low: 0.05
        high: 1.0
        log: true

    snes:
      # snes_num_generations:
      #   type: "int"
      #   low: 5
      #   high: 50
      #   step: 5
      # snes_pop_size:
      #   type: "int"
      #   low: 8
      #   high: 64
      #   step: 8
      snes_sigma:
        type: "float"
        low: 0.01
        high: 1.0
        log: true
      snes_eta_mu:
        type: "float"
        low: 0.1
        high: 1.5
      snes_eta_sigma:
        type: "float"
        low: 0.001
        high: 0.1
        log: true

    cosyne:
      # Keep generations fixed when comparing trials so every trial has the same
      # number of update steps. Enable population search only if unequal total
      # image-evaluation budgets are acceptable.
      # cosyne_pop_size:
      #   type: "categorical"
      #   choices: [8, 16, 32, 64]
      cosyne_init_range:
        type: "float"
        low: 0.01
        high: 1.0
        log: true
      cosyne_mutation_probability:
        type: "float"
        low: 0.05
        high: 0.6
      cosyne_mutation_scale:
        type: "float"
        low: 0.01
        high: 1.0
        log: true
      cosyne_parent_count:
        type: "int"
        low: 2
        high: 8
        step: 2
      cosyne_offspring_count:
        type: "int"
        low: 2
        high: 8
        step: 2

    zero_order:
      # zero_order_num_generations:
      #   type: "int"
      #   low: 5
      #   high: 50
      #   step: 5
      # zero_order_pop_size:
      #   type: "int"
      #   low: 8
      #   high: 64
      #   step: 8
      zero_order_sigma:
        type: "float"
        low: 0.01
        high: 1.0
        log: true
