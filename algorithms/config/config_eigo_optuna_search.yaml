# Discrete text encoder token experiments. See README.md for parameter semantics.
test_ga: true
test_random_sampler: true
test_gomea: true
seed: 42
cuda: 1
aesthetic_predictor: 2
num_inference_steps: 50
guidance_scale: 7.5
lcm_origin_steps: 50
height: 512
width: 512
aesthetic_score_weight: 0.0
clip_score_weight: 1.0
image_reward_score_weight: 0.0
hpsv2_score_weight: 0.0
pickscore_score_weight: 0.0
jpeg_size_weight: 0.0
max_aesthetic_score: 10
max_clip_score: 0.5
max_image_reward_score: 1.0
max_hpsv2_score: 1.0
max_pickscore_score: 1.0
max_jpeg_size_kb: 1024.0
jpeg_quality: 95
image_reward_model: ImageReward-v1.0
clip_model_name: ViT-B/32
hpsv2_version: v2.1
pickscore_model: yuvalkirstain/PickScore_v1
pickscore_processor: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
evaluate_zero_weight_metrics: false
optimization_target: text_tokens
model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
model_backend: auto
base_model_id: null
unet_model_id: null
unet_subfolder: unet
torch_dtype: float16
max_sequence_length: 256
use_safetensors: true
use_multi_gpu: false
pipeline_device_map: balanced
max_memory: null
enable_attention_slicing: false
enable_vae_slicing: false
enable_vae_tiling: false
results_folder: results_eigo_optuna_search_tokens
num_generations: 15
pop_size: 16
save_gens: false
gomea_num_generations: 15
gomea_pop_size: 16
gomea_linkage_model: linkage_tree
gomea_bmp_block_size: 2
gomea_max_evaluations: null
ga_elite_count: 2
ga_crossover_operator: uniform
ga_crossover_rate: 0.8
ga_mutation_operator: replacement
ga_mutation_rate: 0.1
num_images_to_generate: 20
time_limit_seconds: null
optuna:
  n_trials: 30
  direction: maximize
  metric: auto
  study_name: eigo_text_tokens
  storage: sqlite:///results_eigo_optuna_search_tokens/optuna.db
  load_if_exists: true
  catch_trial_errors: true
  sampler:
    name: tpe
    seed: 42
  prompt_source:
    type: diffusiondb
    dataset: poloclub/diffusiondb
    subset: 2m_random_1k
    split: train
    prompt_column: prompt
    count: 10
    seed: 42
    streaming: false
    require_clip_tokenizable: true
    clip_context_length: 77
  plots:
    enabled: true
    output_dir: optuna_plots
    include_plotlyjs: cdn
  search_space:
    ga:
      ga_mutation_rate:
        type: float
        low: 0.01
        high: 0.5
      token_init_rate:
        type: float
        low: 0.05
        high: 1.0
      ga_crossover_operator:
      - uniform
      - one_point
    gomea:
      token_init_rate:
        type: float
        low: 0.05
        high: 1.0
      gomea_linkage_model:
      - univariate
      - linkage_tree
      - full
    random_sampler: {}
token_init_rate: 0.1
