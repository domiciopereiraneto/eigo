# Primary configuration parameters
"selected_prompt": "an astrounat riding a horse in mars" # Text prompt to guide image generation
"optimization_method": "adam" #"cmaes" for CMA-ES variants "adam" for Adam

# General parameters
"seed": 42  # Default seed value for reproducibility
"cuda": 2  # GPU device ID to use (e.g. 0 for the first GPU). If no GPU is available falls back to CPU.
"predictor": 2  # Predictor type= 0 for SAM 1 for LAION V1 2 for LAION V2
"num_inference_steps": 4  # Number of inference steps for the diffusion model during image generation
"guidance_scale": 0  # Guidance scale for classifier-free guidance (set to 0 for no guidance)
"height": 512  # Height of the generated image in pixels
"width": 512  # Width of the generated image in pixels
"alpha": 0.4  # Weight for the aesthetic score in the combined fitness function
"beta": 0.6  # Weight for the CLIP score in the combined fitness function
"max_aesthetic_score": 10  # Maximum possible aesthetic score (used for normalization)
"max_clip_score": 0.5  # Maximum possible CLIP score (used for normalization)
"model_id": "black-forest-labs/FLUX.1-schnell" # Model ID (e.g., "black-forest-labs/FLUX.1-schnell", "PixArt-alpha/PixArt-XL-2-1024-MS", "stabilityai/sdxl-turbo")
"model_backend": "auto"  # Diffusion backend: "auto", "sdxl", "flux", or "pixart"
"torch_dtype": "float16"  # "auto", "float32", "float16", or "bfloat16" (FLUX on GPU usually benefits from bfloat16)
"max_sequence_length": 256  # Max token length for FLUX text encoding (ignored for SDXL)
"use_safetensors": true  # Load model weights from safetensors when available
"use_multi_gpu": false  # If true and multiple CUDA devices exist, shard the diffusion pipeline across GPUs
"pipeline_device_map": "balanced"  # Device-map strategy for multi-GPU sharding (e.g., "balanced", "auto")
"max_memory": null  # Optional per-device memory map, e.g. {"cuda:0":"22GiB","cuda:1":"22GiB","cpu":"64GiB"}
"enable_gradient_checkpointing": true  # Recommended true for Adam with FLUX/PixArt to reduce activation memory
"enable_attention_slicing": true  # Enable attention slicing for lower VRAM usage (slower)
"enable_vae_slicing": true  # Enable VAE slicing for lower VRAM usage
"enable_vae_tiling": true  # Enable VAE tiling for high-resolution/low-VRAM decoding
"results_folder": "results_flux_test_adam"  # Folder to save results including

# CMA-ES specific parameters (if selected)
"num_generations": 50  # Number of generations for the CMA-ES optimization process
"pop_size": 10  # Population size for CMA-ES optimization
"cmaes_variant": "sep"  # Variant of CMA-ES to use: "cmaes" (standard) "sep" (sep-CMA-ES) or "vd" (VD-CMA)
"sigma": 0.01  # Initial standard deviation for CMA-ES optimization
save_gens: true # Save individuals of each generation to the results folder

# Adam specific parameters (if selected)
"num_iterations": 1000  # Number of iterations for the Adam optimization process
"adam_lr": 1e-4  # Learning rate for the Adam optimizer
"adam_weight_decay": 0  # Weight decay for the Adam optimizer
"adam_eps": 1e-8  # Epsilon value for numerical stability in the Adam
"adam_beta1": 0.9  # Beta1 parameter for the Adam optimizer
"adam_beta2": 0.999  # Beta2 parameter for the Adam optimizer
"adam_max_grad_norm": null  # Gradient norm clipping threshold for Adam; set to null or <=0 to disable

# Time limit specification
time_limit_seconds: null # Time limit in seconds, if null then it follows the number of generations/iterations
