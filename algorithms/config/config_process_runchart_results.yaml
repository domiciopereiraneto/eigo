# Runchart plotting config for algorithms/process_runchart_results.py.
#
# Run:
#   python algorithms/process_runchart_results.py --config algorithms/config/config_process_runchart_results.yaml
#
# The script aggregates prompt-level metric curves and writes metric-vs-NFE and
# metric-vs-time CSV/PNG files.

# Each item can be an experiment folder containing results_* prompt folders, or a
# parent folder to search recursively for experiment folders.
experiment_folders:
# - results_new/results_ccsepcmaes_sd15_noise_embeddings_clip
- results_new/results_ccsepcmaes_sd15_noise_embeddings_hpsv2
# - results_new/results_ccsepcmaes_sd15_noise_embeddings_imagereward
# - results_new/results_ccsnes_sd15_noise_embeddings_clip
- results_new/results_ccsnes_sd15_noise_embeddings_hpsv2
# - results_new/results_ccsnes_sd15_noise_embeddings_imagereward
# - results_new/results_sepcmaes_sd15_noise_embeddings_clip
- results_new/results_sepcmaes_sd15_noise_embeddings_hpsv2
# - results_new/results_sepcmaes_sd15_noise_embeddings_imagereward
# - results_new/results_snes_sd15_noise_embeddings_clip
- results_new/results_snes_sd15_noise_embeddings_hpsv2
# - results_new/results_snes_sd15_noise_embeddings_imagereward

# Optional labels for experiment_folders. If provided, this list must have one
# label for each active experiment_folders entry.
experiment_labels:
  - "CC-sep-CMA-ES"
  - "CC-SNES"
  - "sep-CMA-ES (flat)"
  - "SNES (flat)"

# Optional matplotlib markers for experiment_folders. If provided, this list
# must have one marker for each active experiment_folders entry.
experiment_markers:
  - "^"
  - "^"
  - "o"
  - "o"

# Optional baseline folders to draw as horizontal constant lines. For each
# configured folder, the script takes the final value from each prompt run,
# averages those final values, and plots that mean as a constant line.
constant_experiment_folders:
  # - results_sd15_v3/results_randomsampler_sd15_imagereward
  # - results_sd15_v3/results_randomsampler_sd15dpo_imagereward
constant_labels:
  # - "Best-of-N"
  # - "Best-of-N (DPO)"

save_folder: results_runcharts_sd15
clean_output: false

# Valid canonical metric names include:
# objective, aesthetic_score, clip_score, image_reward_score, hpsv2_score,
# pickscore_score, jpeg_size_kb, elapsed_time, peak_vram_mb.
metrics:
  #- clip_score
  #- image_reward_score
  #- hpsv2_score
  - pickscore_score

# true plots the best-so-far value for each prompt run before aggregating.
# For jpeg_size_kb and combined_loss, lower is treated as better.
best_so_far: true

# NFE axis scale for metric-vs-compute plots. NFE counts diffusion denoising
# forward passes:
#   Adam/score CSVs: (iteration + 1) * num_inference_steps
#   population/fitness CSVs: (1 + generation * pop_size) * num_inference_steps
#   random sampler fitness CSVs with sample_end: (sample_end + 1) * num_inference_steps
# Use log to match common inference compute plots, or linear for an untransformed
# NFE axis.
nfe_xscale: linear

# The plots use each experiment's native CSV points. No interpolation grid is
# applied; each line has the original number of recorded NFE/time points for
# that experiment.

# Time axis limit:
#   shortest: use the shortest valid elapsed-time coverage across experiments
#   null: no truncation; plot through the longest available elapsed time
#   number: use that many seconds
time_limit: 400

label_template: "{algorithm}"
figure_width: 6.0
figure_height: 6.0
font_size: 13
marker_size: 6.0
