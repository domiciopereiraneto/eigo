# Primary configuration parameters
"optimization_method": "ga" #"cmaes" for CMA-ES variants, "ga" for the genetic algorithm, "adam" for AdamW, "random_sampler" for random seed sampling

# Prompt dataset parameters (used by cmaes_p2.py)
seed_path: "algorithms/config/seeds.txt"  # Path to a file with seeds; if null, uses the 'seed' below
seed: 42  # Default seed value for reproducibility
prompt_per_categorie: 3  # Number of prompts sampled per category from the dataset
prompt_sample_seed: 42  # Seed for prompt sampling from the dataset
single_prompt_per_seed: true  # If true, ignore per-category sampling and pick one prompt from the full dataset using each run seed

# General generation/scoring parameters
cuda: 1  # GPU device ID to use (e.g., 0 for first GPU); falls back to CPU if unavailable
predictor: 2  # 0: SAM, 1: LAION V1, 2: LAION V2
num_inference_steps: 1  # Diffusion inference steps during image generation; LCM usually works well with 1-8
guidance_scale: 0 # Classifier-free guidance scale (0 means disabled)
lcm_origin_steps: 50  # Original diffusion steps for LCM backends; ignored by other backends
height: 512  # Generated image height (pixels)
width: 512  # Generated image width (pixels)
aesthetic_score_weight: 0.0  # Weight for aesthetic score in combined fitness
clip_score_weight: 1.0  # Weight for CLIP score in combined fitness
image_reward_score_weight: 0.0  # Weight for ImageReward score in combined fitness
hpsv2_score_weight: 0.0  # Weight for HPSv2 score in combined fitness
pickscore_score_weight: 0.0  # Weight for PickScore score in combined fitness
max_aesthetic_score: 10  # Maximum aesthetic score (normalization)
max_clip_score: 0.5  # Maximum CLIP score (normalization)
max_image_reward_score: 1.0  # Approximate ImageReward normalization constant
max_hpsv2_score: 1.0  # Approximate HPSv2 normalization constant
max_pickscore_score: 1.0  # Approximate PickScore normalization constant
image_reward_model: "ImageReward-v1.0"  # ImageReward checkpoint name; set to null to disable ImageReward calculation
hpsv2_version: "v2.1"  # HPSv2 checkpoint version; set to null to disable HPSv2 calculation
pickscore_model: "yuvalkirstain/PickScore_v1"  # PickScore checkpoint name; set to null to disable PickScore calculation
pickscore_processor: "laion/CLIP-ViT-H-14-laion2B-s32B-b79K"  # Processor backbone for PickScore; set to null to disable PickScore calculation
evaluate_zero_weight_metrics: true  # Keep zero-weight scorer models/graphs out of Adam VRAM
results_folder: "results_ga_sdxl_clip"  # Output directory for runs and artifacts

# Diffusion model parameters
model_id: "stabilityai/sdxl-turbo" # Model ID (e.g., "black-forest-labs/FLUX.1-schnell", "PixArt-alpha/PixArt-XL-2-1024-MS", "stabilityai/sdxl-turbo", "SimianLuo/LCM_Dreamshaper_v7")
model_backend: "auto"  # "auto", "sdxl", "flux", "pixart", or "lcm"
torch_dtype: "float32"  # "auto", "float32", "float16", or "bfloat16"
max_sequence_length: 256  # FLUX text encoder token limit (ignored for SDXL)
use_safetensors: true  # Prefer safetensors weights when available

# Pipeline memory/performance options
use_multi_gpu: false  # If true and multiple CUDA devices exist, shard pipeline across GPUs
pipeline_device_map: "balanced"  # Device map strategy (e.g. "balanced", "auto")
max_memory: null  # Optional memory map, e.g. {"cuda:0":"22GiB","cuda:1":"22GiB","cpu":"64GiB"}
enable_gradient_checkpointing: false  # Lower memory use at the cost of speed
enable_attention_slicing: false  # Lower VRAM use (slower)
enable_vae_slicing: false  # Lower VRAM use for VAE
enable_vae_tiling: false  # Useful for high-res decode on limited VRAM

# CMA-ES specific parameters
num_generations: 100 # Number of CMA-ES generations
pop_size: 20  # CMA-ES population size
cmaes_variant: "sep"  # "cmaes" (standard), "sep", or "vd"
sigma: 0.5288560382657754  # Initial CMA-ES standard deviation
save_gens: true # Save individuals of each generation to the results folder

# AdamW specific parameters (if selected)
"num_iterations": 2000  # Number of iterations for the Adam optimization process
"adam_lr": 0.00841569819635589  # Learning rate for the Adam optimizer
"adam_weight_decay": 0.0015074877105651296  # Weight decay for the Adam optimizer
"adam_eps": 8.99027068588055e-09  # Epsilon value for numerical stability in the Adam
"adam_beta1": 0.732029767336436  # Beta1 parameter for the Adam optimizer
"adam_beta2": 0.9343493370833612  # Beta2 parameter for the Adam optimizer
"adam_max_grad_norm": null  # Gradient norm clipping threshold for Adam; set to null or <=0 to disable

# GA specific parameters
ga_mutation_std: 0.501554580095495  # Standard deviation of Gaussian mutation noise
ga_elite_count: 3  # Number of top individuals copied unchanged to the next generation
ga_crossover_rate: 0.6869360053907664  # Per-dimension probability of inheriting from parent A during crossover
ga_mutation_rate: 0.24177469735855533  # Per-dimension probability of applying mutation noise

# Random sampler specific parameters
num_images_to_generate: 3000  # Number of random generation seeds/images to evaluate

# Time limit specification
time_limit_seconds: null # Time limit in seconds, if null then it follows the number of generations/iterations
