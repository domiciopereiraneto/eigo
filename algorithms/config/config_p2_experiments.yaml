# Primary configuration parameters
"optimization_method": "adam" #"cmaes" for CMA-ES variants, "ga" for the genetic algorithm, "adam" for AdamW, "random_sampler" for random seed sampling

# Prompt dataset parameters (used by p2_experiments.py)
seed_path: null  # Path to a file with seeds; if null, uses the 'seed' below
seed: 42  # Default seed value for reproducibility
prompt_dataset: "drawbench"  # Prompt source: "parti" or "drawbench"
prompt_dataset_path: null  # Optional HF dataset override; defaults to nateraw/parti-prompts or sayakpaul/drawbench
prompt_dataset_config: null  # Optional HF dataset config/subset name
prompt_dataset_split: null  # Optional split override; defaults to train
prompt_column: null  # Optional prompt column override
prompt_category_column: null  # Optional category column override
prompt_per_categorie: null  # Number of prompts sampled per category from the dataset
prompt_sample_seed: null  # Seed for prompt sampling from the dataset
use_entire_dataset: true  # If true, use every prompt for each seed; overrides prompt_per_categorie and single_prompt_per_seed
prompt_index_range: [0,100]  # Optional when use_entire_dataset is true: zero-based [start, end) slice, e.g. [0, 50]
single_prompt_per_seed: false  # If true, ignore per-category sampling and pick one prompt from the full dataset using each run seed

# General generation/scoring parameters
cuda: 0  # GPU device ID to use (e.g., 0 for first GPU); falls back to CPU if unavailable
predictor: 2  # 0: SAM, 1: LAION V1, 2: LAION V2
num_inference_steps: 50  # Diffusion inference steps during image generation; LCM usually works well with 1-8
batch_size: 8  # Number of candidates/images to generate and score at once for CMA-ES/GA/random_sampler
guidance_scale: 7.5 # Classifier-free guidance scale (0 means disabled)
lcm_origin_steps: 50  # Original diffusion steps for LCM backends; ignored by other backends
height: 512  # Generated image height (pixels)
width: 512  # Generated image width (pixels)
aesthetic_score_weight: 0.0  # Weight for aesthetic score in combined fitness
clip_score_weight: 0.0  # Weight for CLIP score in combined fitness
image_reward_score_weight: 1.0  # Weight for ImageReward score in combined fitness
hpsv2_score_weight: 0.0  # Weight for HPSv2 score in combined fitness
pickscore_score_weight: 0.0  # Weight for PickScore score in combined fitness
jpeg_size_weight: 0.0  # Weight for JPEG size penalty in combined fitness (smaller is better)
max_aesthetic_score: 10  # Maximum aesthetic score (normalization)
max_clip_score: 0.5  # Maximum CLIP score (normalization)
max_image_reward_score: 1.0  # Approximate ImageReward normalization constant
max_hpsv2_score: 1.0  # Approximate HPSv2 normalization constant
max_pickscore_score: 1.0  # Approximate PickScore normalization constant
max_jpeg_size_kb: 1024.0  # JPEG size normalization constant in kilobytes
jpeg_quality: 95  # JPEG encoding quality used for saved images and size evaluation
image_reward_model: "ImageReward-v1.0"  # ImageReward checkpoint name; set to null to disable ImageReward calculation
clip_model_name: "ViT-B/32"  # OpenAI CLIP model used for CLIP score and LAION aesthetic predictors
hpsv2_version: "v2.1"  # HPSv2 checkpoint version; set to null to disable HPSv2 calculation
pickscore_model: "yuvalkirstain/PickScore_v1"  # PickScore checkpoint name; set to null to disable PickScore calculation
pickscore_processor: "laion/CLIP-ViT-H-14-laion2B-s32B-b79K"  # Processor backbone for PickScore; set to null to disable PickScore calculation
evaluate_zero_weight_metrics: false  # Keep zero-weight scorer models/graphs out of Adam VRAM
optimization_target: "prompt_embeddings"  # "prompt_embeddings" or "latent_noise" for CMA-ES/GA/Adam/random_sampler
results_folder: "results_adam_embeddings_imagereward"  # Output directory for runs and artifacts

# Diffusion model parameters
model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5" # Model ID (e.g., "black-forest-labs/FLUX.1-schnell", "PixArt-alpha/PixArt-XL-2-1024-MS", "Efficient-Large-Model/Sana_Sprint_1.6B_1024px_diffusers", "Efficient-Large-Model/Sana_1600M_1024px_diffusers", "stabilityai/sdxl-turbo", "SimianLuo/LCM_Dreamshaper_v7")
model_backend: "auto"  # "auto", "sdxl", "flux", "pixart", "lcm", "sana", or "sana_sprint"
torch_dtype: "float16"  # "auto", "float32", "float16", or "bfloat16"
max_sequence_length: 256  # FLUX/Sana text encoder token limit (ignored for SDXL)
use_safetensors: true  # Prefer safetensors weights when available

# Pipeline memory/performance options
use_multi_gpu: false  # If true and multiple CUDA devices exist, shard pipeline across GPUs
pipeline_device_map: "balanced"  # Device map strategy (e.g. "balanced", "auto")
max_memory: null  # Optional memory map, e.g. {"cuda:0":"22GiB","cuda:1":"22GiB","cpu":"64GiB"}
enable_gradient_checkpointing: true  # Lower memory use at the cost of speed
enable_attention_slicing: false  # Lower VRAM use (slower)
enable_vae_slicing: false  # Lower VRAM use for VAE
enable_vae_tiling: false  # Useful for high-res decode on limited VRAM

# CMA-ES specific parameters
num_generations: 15 # Number of CMA-ES generations
pop_size: 16  # CMA-ES population size
cmaes_variant: "sep"  # "cmaes" (standard), "sep", or "vd"
sigma: 0.1  # Initial CMA-ES standard deviation
save_gens: true # Save individuals of each generation to the results folder

# AdamW specific parameters (if selected)
"num_iterations": 240  # Number of iterations for the Adam optimization process
"adam_lr": 1e-3  # Learning rate for the Adam optimizer
"adam_weight_decay": 1e-2  # Weight decay for the Adam optimizer
"adam_eps": 1e-5  # Epsilon value for numerical stability in the Adam
"adam_beta1": 0.9  # Beta1 parameter for the Adam optimizer
"adam_beta2": 0.999  # Beta2 parameter for the Adam optimizer
"adam_max_grad_norm": null  # Gradient norm clipping threshold for Adam; set to null or <=0 to disable

# GA specific parameters
ga_mutation_std: 0.6053448468001081  # Standard deviation of Gaussian mutation noise
ga_elite_count: 1  # Number of top individuals copied unchanged to the next generation
ga_crossover_rate: 0.5818212352431953  # Per-dimension probability of inheriting from parent A during crossover
ga_mutation_rate: 0.16678651087305188  # Per-dimension probability of applying mutation noise

# Random sampler specific parameters
num_images_to_generate: 240  # Number of random seeds/images to evaluate; latent_noise samples random latent vectors

# Time limit specification
time_limit_seconds: null # Time limit in seconds, if null then it follows the number of generations/iterations
