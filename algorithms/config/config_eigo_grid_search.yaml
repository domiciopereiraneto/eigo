# Discrete text encoder token experiments. See README.md for parameter semantics.
selected_prompts:
- an astronaut riding a horse on mars
- a serene mountain landscape with a tranquil lake at sunset
- a futuristic cyberpunk city with neon lights and flying cars
- a cozy library with ancient books and warm candlelight
- a vibrant underwater coral reef with colorful tropical fish
test_ga: true
test_gomea: true
test_random_sampler: true
seed: 42
cuda: 2
aesthetic_predictor: 2
num_inference_steps: 1
guidance_scale: 0
lcm_origin_steps: 50
height: 512
width: 512
aesthetic_score_weight: 0.5
clip_score_weight: 0.5
image_reward_score_weight: 0.0
hpsv2_score_weight: 0.0
pickscore_score_weight: 0.0
jpeg_size_weight: 0.0
max_aesthetic_score: 10
max_clip_score: 0.5
max_image_reward_score: 1.0
max_hpsv2_score: 1.0
max_pickscore_score: 1.0
max_jpeg_size_kb: 1024.0
jpeg_quality: 95
image_reward_model: ImageReward-v1.0
clip_model_name: ViT-L/14
hpsv2_version: v2.1
pickscore_model: yuvalkirstain/PickScore_v1
pickscore_processor: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
evaluate_zero_weight_metrics: false
optimization_target: text_tokens
model_id: stabilityai/sdxl-turbo
model_backend: auto
base_model_id: null
unet_model_id: null
unet_subfolder: unet
torch_dtype: float32
max_sequence_length: 256
use_safetensors: true
use_multi_gpu: false
pipeline_device_map: balanced
max_memory: null
enable_attention_slicing: false
enable_vae_slicing: false
enable_vae_tiling: false
results_folder: results_eigo_grid_search_tokens
num_generations: 50
pop_size: 50
save_gens: false
ga_elite_count: 2
ga_crossover_operator: uniform
ga_crossover_rate: 0.8
ga_mutation_operator: replacement
ga_mutation_rate: 0.1
num_images_to_generate: 20
gomea_num_generations: 50
gomea_pop_size: 50
gomea_linkage_model: linkage_tree
gomea_bmp_block_size: 2
gomea_max_evaluations: null
time_limit_seconds: null
grid:
  ga:
    ga_mutation_rate:
    - 0.05
    - 0.1
    - 0.2
    token_init_rate:
    - 0.1
    - 0.3
  gomea:
    gomea_linkage_model:
    - univariate
    - linkage_tree
    token_init_rate:
    - 0.1
    - 0.3
  random_sampler:
    num_images_to_generate:
    - 240
token_init_rate: 0.1
