# Optuna-study schedule for algorithms/optuna_schedule.py.
#
# Each run is recursively merged onto config_eigo_optuna_search.yaml before
# launching eigo_optuna_search.py. Give every run distinct results_folder,
# optuna.study_name, and optuna.storage values so studies remain independent.

runs:
  - test_cmaes: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 0.0
    image_reward_score_weight: 1.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_sepcmaes_imagereward"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_sepcmaes_imagereward"
      storage: "sqlite:///results_optuna_sdxlturbo_sepcmaes_imagereward/optuna.db"

  - test_cmaes: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 1.0
    image_reward_score_weight: 0.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_sepcmaes_clip"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_sepcmaes_clip"
      storage: "sqlite:///results_optuna_sdxlturbo_sepcmaes_clip/optuna.db"

  - test_cmaes: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 0.0
    image_reward_score_weight: 0.0
    hpsv2_score_weight: 1.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_sepcmaes_hpsv2"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_sepcmaes_hpsv2"
      storage: "sqlite:///results_optuna_sdxlturbo_sepcmaes_hpsv2/optuna.db"

  - test_ga: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 0.0
    image_reward_score_weight: 1.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_ga_imagereward"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_ga_imagereward"
      storage: "sqlite:///results_optuna_sdxlturbo_ga_imagereward/optuna.db"

  - test_ga: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 1.0
    image_reward_score_weight: 0.0
    hpsv2_score_weight: 0.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_ga_clip"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_ga_clip"
      storage: "sqlite:///results_optuna_sdxlturbo_ga_clip/optuna.db"

  - test_ga: true
    aesthetic_score_weight: 0.0
    clip_score_weight: 0.0
    image_reward_score_weight: 0.0
    hpsv2_score_weight: 1.0
    pickscore_score_weight: 0.0
    jpeg_size_weight: 0.0
    results_folder: "results_optuna_sdxlturbo_ga_hpsv2"
    optuna:
      study_name: "eigo_optuna_search_sdxlturbo_ga_hpsv2"
      storage: "sqlite:///results_optuna_sdxlturbo_ga_hpsv2/optuna.db"
