# Discrete text encoder token experiments. See README.md for parameter semantics.
runs:
- test_ga: true
  test_gomea: false
  test_random_sampler: false
  results_folder: results_optuna_ga_tokens
  optuna:
    study_name: ga_tokens
    storage: sqlite:///results_optuna_ga_tokens/optuna.db
- test_ga: false
  test_gomea: true
  test_random_sampler: false
  results_folder: results_optuna_gomea_tokens
  optuna:
    study_name: gomea_tokens
    storage: sqlite:///results_optuna_gomea_tokens/optuna.db
- test_ga: false
  test_gomea: false
  test_random_sampler: true
  results_folder: results_optuna_random_sampler_tokens
  optuna:
    study_name: random_sampler_tokens
    storage: sqlite:///results_optuna_random_sampler_tokens/optuna.db
